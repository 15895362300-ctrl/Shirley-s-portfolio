    setStatus('Unpacking ' + uuids.length + ' assets...');

      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {

    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).

      var i = h.indexOf(':');

    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;

bkit-font-smoothing: antialiased; }\n  body { margin: 0; font-family: \"Noto Sans SC\", sans-serif; }\n  .proto-root {\n    --page:#F1EBDE; --surface:#FFFFFF; --cream:#F4EEE2; --cream2:#EFE8D9;\n    --line:#E7DECF; --ink:#26211B; --text:#3A332B; --muted:#8C7F6E;\n    --pill:#39342B; --on-pill:#F4EFE6;\n    --accent:#2E3D2E; --accent-soft:#E9EEE6; --accent-press:#243023; --on-accent:#FBFAF4;\n    --warn:#9A3B2E; --warn-soft:#F4E5DF;\n    --radius:14px; --title-font:\"Noto Serif SC\", serif;\n  }\n  .proto-root[data-accent=\"bronze\"]{ --accent:#8B5E34; --accent-soft:#F1E7D7; --accent-press:#6F4A29; }\n  .proto-root[data-accent=\"ink\"]{ --accent:#2B2A2E; --accent-soft:#EAE9EB; --accent-press:#1D1C20; }\n  .proto-root[data-radius=\"sharp\"]{ --radius:4px; }\n  .proto-root[data-title=\"sans\"]{ --title-font:\"Noto Sans SC\", sans-serif; }\n  .scr::-webkit-scrollbar{ width:0; height:0; }\n  .scr{ scrollbar-width:none; }\n  @keyframes toastin { from{ transform:translate(-50%,12px); opacity:0 } to{ transform:translate(-50%,0); opacity:1 } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div class=\"proto-root\" data-accent=\"{{accentKey}}\" data-radius=\"{{radiusKey}}\" data-title=\"{{titleFontKey}}\" style=\"min-height:100vh; background:#E9E1D2; display:flex; align-items:flex-start; justify-content:center; padding:32px 20px 60px\">\n  <div style=\"position:relative; width:390px; height:844px; border-radius:24px; box-shadow:0 24px 70px rgba(40,33,24,.22); overflow:hidden; display:flex; flex-direction:column; background:var(--page)\">\n\n    <div style=\"height:44px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 20px 0 26px; font-size:14px; font-weight:700; color:#fff; background:var(--accent)\"><span>9:41<\u002Fspan><span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"font-size:11px; letter-spacing:1px\">●●●<\u002Fspan><span style=\"font-size:11px; font-weight:600\">5G<\u002Fspan><span style=\"width:23px; height:12px; border:1.5px solid #fff; border-radius:3px; display:inline-block; position:relative\"><i style=\"position:absolute; left:1.5px; top:1.5px; bottom:1.5px; right:5px; background:#fff; border-radius:1px; display:block\"><\u002Fi><\u002Fspan><\u002Fspan><\u002Fdiv>\n\n    <div class=\"scr\" style=\"flex:1; overflow-y:auto; background:var(--page)\">\n      <!-- profile header -->\n      <div style=\"background:var(--accent); padding:6px 20px 30px; color:var(--on-accent)\">\n        <div style=\"display:flex; align-items:center; gap:15px\">\n          <div style=\"width:62px; height:62px; border-radius:50%; flex:none; background:var(--cream); display:flex; align-items:center; justify-content:center; font-family:var(--title-font); font-size:24px; font-weight:700; color:var(--accent)\">藏<\u002Fdiv>\n          <div style=\"flex:1; min-width:0\"><div style=\"font-family:var(--title-font); font-size:20px; font-weight:700\">听蛙斋主<\u002Fdiv><div style=\"font-size:12px; opacity:.82; margin-top:5px\">已登录 · 用于收藏与竞拍同步<\u002Fdiv><\u002Fdiv>\n          <span onclick=\"{{tapSettings}}\" style=\"font-size:13px; opacity:.88; cursor:pointer\">设置 ›<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- trade center card -->\n      <div style=\"margin:-18px 16px 0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 8px 24px rgba(40,33,24,.1); padding:6px 4px 14px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:13px 14px 11px\"><span style=\"font-size:15px; font-weight:600; color:var(--ink)\">交易中心<\u002Fspan><span onclick=\"{{tapAllTrade}}\" style=\"font-size:12px; color:var(--muted); cursor:pointer\">全部记录 ›<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex\">\n          <sc-for list=\"{{tradeItems}}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div onclick=\"{{tapTrade}}\" data-arg=\"{{t.label}}\" style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0; cursor:pointer; position:relative\">\n              <span style=\"width:44px; height:44px; border-radius:13px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:var(--title-font); font-size:18px; font-weight:700\">{{t.icon}}<\u002Fspan>\n              <span style=\"font-size:12px; color:var(--text)\">{{t.label}}<\u002Fspan>\n              <sc-if value=\"{{t.badge}}\" hint-placeholder-val=\"{{false}}\"><span style=\"position:absolute; top:-2px; right:16px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--warn); color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center\">{{t.badgeText}}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- orders entry -->\n      <div onclick=\"{{tapOrders}}\" style=\"margin:14px 16px 0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; display:flex; align-items:center; cursor:pointer; box-shadow:0 4px 14px rgba(40,33,24,.05)\">\n        <span style=\"width:42px; height:42px; border-radius:12px; flex:none; background:var(--cream); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--title-font); font-size:18px; font-weight:700\">单<\u002Fspan>\n        <div style=\"flex:1; margin-left:14px\"><div style=\"font-size:15px; font-weight:600; color:var(--ink)\">我的订单<\u002Fdiv><div style=\"font-size:12px; color:var(--muted); margin-top:3px\">付尾款、查看物流与发票<\u002Fdiv><\u002Fdiv>\n        <span style=\"font-size:11px; color:var(--warn); background:var(--warn-soft); padding:3px 9px; border-radius:999px; margin-right:8px\">1 笔待付<\u002Fspan>\n        <span style=\"font-size:18px; color:var(--muted)\">›<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- stat strip -->\n      <div style=\"margin:14px 16px 0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); display:flex; padding:16px 0; box-shadow:0 4px 14px rgba(40,33,24,.05)\">\n        <sc-for list=\"{{stats}}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div onclick=\"{{tapStat}}\" data-arg=\"{{s.label}}\" style=\"flex:1; text-align:center; cursor:pointer; border-right:1px solid {{s.border}}\"><div style=\"font-size:20px; font-weight:700; color:var(--ink)\">{{s.value}}<\u002Fdiv><div style=\"font-size:12px; color:var(--muted); margin-top:4px\">{{s.label}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- menu -->\n      <div style=\"margin:14px 16px 0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:0 4px 14px rgba(40,33,24,.05)\">\n        <sc-for list=\"{{menuItems}}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div onclick=\"{{tapMenu}}\" data-arg=\"{{m.label}}\" style=\"display:flex; align-items:center; justify-content:space-between; padding:15px 16px; border-bottom:1px solid var(--line); cursor:pointer\">\n            <span style=\"display:flex; align-items:center; gap:11px\"><span style=\"width:30px; height:30px; border-radius:8px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--accent)\">{{m.icon}}<\u002Fspan><span style=\"font-size:15px; color:var(--ink)\">{{m.label}}<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:13px; color:var(--muted)\">{{m.right}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin:16px; padding:14px 16px; background:var(--cream); border-radius:var(--radius); font-size:11px; color:var(--muted); line-height:1.8\">竞拍出价不可撤销，保证金、尾款、退款和成交状态以平台规则及后台确认为准。<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"height:64px; flex:none; display:flex; background:var(--surface); border-top:1px solid var(--line)\">\n      <div onclick=\"{{tapHome}}\" style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:11px; cursor:pointer\"><span style=\"width:9px; height:9px; border:2px solid var(--muted); border-radius:50%\"><\u002Fspan>首页<\u002Fdiv>\n      <div onclick=\"{{tapAuction}}\" style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:11px; cursor:pointer\"><span style=\"width:9px; height:9px; border:2px solid var(--muted); border-radius:50%\"><\u002Fspan>拍品<\u002Fdiv>\n      <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--accent); font-size:11px; font-weight:600\"><span style=\"width:9px; height:9px; background:var(--accent); border-radius:50%\"><\u002Fspan>我的<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"position:absolute; left:50%; bottom:88px; transform:translateX(-50%); background:rgba(38,33,27,.94); color:#fff; padding:12px 24px; border-radius:12px; font-size:14px; z-index:30; animation:toastin .25s ease; box-shadow:0 10px 30px rgba(0,0,0,.25); white-space:nowrap\">{{toast}}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;森林绿&quot;,&quot;古铜棕&quot;,&quot;水墨黛&quot;],&quot;default&quot;:&quot;森林绿&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleFont&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;宋体 Serif&quot;,&quot;黑体 Sans&quot;],&quot;default&quot;:&quot;宋体 Serif&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cardRadius&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;圆角 Soft&quot;,&quot;直角 Sharp&quot;],&quot;default&quot;:&quot;圆角 Soft&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { toast: null };\n\n  toast(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: null }), 1800);\n  }\n\n  renderVals() {\n    const A = this.props.accent || '森林绿';\n    const accentKey = { '森林绿': 'forest', '古铜棕': 'bronze', '水墨黛': 'ink' }[A] || 'forest';\n    const radiusKey = (this.props.cardRadius || '圆角 Soft').indexOf('直角') >= 0 ? 'sharp' : 'soft';\n    const titleFontKey = (this.props.titleFont || '宋体 Serif').indexOf('黑体') >= 0 ? 'sans' : 'serif';\n\n    const tradeItems = [\n      { icon: '出', label: '我的出价', badge: true, badgeText: '1' },\n      { icon: '保', label: '我的保证金', badge: true, badgeText: '1' },\n      { icon: '中', label: '我的中拍', badge: false, badgeText: '' },\n      { icon: '托', label: '我的委托', badge: false, badgeText: '' }\n    ];\n    const stats = [\n      { value: '12', label: '我的收藏', border: 'var(--line)' },\n      { value: '3', label: '关注拍品', border: 'var(--line)' },\n      { value: '28', label: '浏览历史', border: 'transparent' }\n    ];\n    const menuItems = [\n      { icon: '藏', label: '我的收藏', right: '12 ›' },\n      { icon: '史', label: '浏览历史', right: '本地记录' },\n      { icon: '址', label: '收货地址', right: '2 ›' },\n      { icon: '介', label: '关于平台', right: '›' },\n      { icon: '客', label: '联系客服 / 反馈', right: '›' }\n    ];\n\n    return {\n      accentKey, radiusKey, titleFontKey, tradeItems, stats, menuItems,\n      toast: this.state.toast, hasToast: !!this.state.toast,\n      tapSettings: () => this.toast('打开设置'),\n      tapAllTrade: () => this.toast('全部交易记录'),\n      tapTrade: (e) => this.toast('进入「' + e.currentTarget.dataset.arg + '」'),\n      tapOrders: () => this.toast('进入我的订单'),\n      tapStat: (e) => this.toast('查看' + e.currentTarget.dataset.arg),\n      tapMenu: (e) => this.toast('进入「' + e.currentTarget.dataset.arg + '」'),\n      tapHome: () => this.toast('返回首页'),\n      tapAuction: () => this.toast('进入拍品')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"我的-网格版.dc"}
